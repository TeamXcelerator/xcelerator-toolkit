[package]
name = "xc-numerics"
description = "High-precision numerical primitives: linear algebra, Newton iteration, Gauss-Legendre quadrature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# High-precision tier via rug (MPFR/GMP).
# Build: cargo build --release --features hp
# Requires: sudo apt install build-essential m4 libgmp-dev libmpfr-dev libmpc-dev
hp = ["dep:rug", "dep:serde", "dep:serde_json", "dep:zip", "dep:xc-cache", "dep:sha2", "cuda-product"]
# Opt-in certified quadrature using a separately installed FLINT 3 library.
# FLINT and Rug must use the same GMP/MPFR libraries. Cargo unifies this
# dependency with Rug's; builds without Arb retain Rug's bundled defaults.
arb = ["hp", "dep:cc", "dep:gmp-mpfr-sys"]
# Exact integer products. CUDA libraries are discovered at runtime so HP
# binaries also run on CPU-only hosts without installing CUDA.
modular-product = ["dep:num-bigint", "dep:num-integer", "dep:num-traits"]
cuda-product = ["modular-product"]

[dependencies]
anyhow = { workspace = true }
rayon = { workspace = true }
rug = { workspace = true, optional = true }
gmp-mpfr-sys = { version = "~1.7", default-features = false, features = ["mpfr", "use-system-libs"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
xc-core = { workspace = true }
xc-cache = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
num-bigint = { version = "=0.4.8", optional = true }
num-integer = { version = "=0.1.46", optional = true }
num-traits = { version = "=0.2.19", optional = true }

[build-dependencies]
cc = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
xc-cache = { workspace = true, features = ["test-support"] }
xc-core = { workspace = true, features = ["test-support"] }
