[package]
name = "xc-cache"
description = "Granular content-addressed cache fabric with overlays, quality gates, compatibility policy, and GitHub shard planning."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
# Preserve the existing V1/V2 encoder bytes on Linux and native Windows.
flate2 = { version = "=1.1.9", default-features = false, features = ["miniz_oxide"] }
miniz_oxide = { version = "=0.8.9", default-features = false }
rayon = { workspace = true }
fs2 = { workspace = true }
getrandom = { workspace = true }
xc-core = { workspace = true }

[dev-dependencies]
xc-core = { workspace = true, features = ["test-support"] }

[build-dependencies]
sha2 = { workspace = true }
