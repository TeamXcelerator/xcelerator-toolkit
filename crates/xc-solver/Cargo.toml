[package]
name = "xc-solver"
description = "Multi-solver framework with explicit targets, diagnostics, cross-checks, and deterministic f64 reference solvers."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
hp-reference = ["dep:rug", "xc-numerics/hp", "xc-operator/hp"]

[dependencies]
num-bigint = "0.4.8"
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rug = { workspace = true, optional = true }
xc-core = { workspace = true }
xc-operator = { workspace = true }
xc-numerics = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
