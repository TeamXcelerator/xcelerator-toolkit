[package]
name = "xc-zeta"
description = "Riemann zeta function utilities: reference zero loading, generation, comparison helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
hp = ["dep:rug", "dep:gmp-mpfr-sys"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rug = { workspace = true, optional = true }

# The native UCRT lane uses the same qualified GMP/MPFR for every HP producer.
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
gmp-mpfr-sys = { workspace = true, optional = true, features = ["use-system-libs"] }

[dev-dependencies]
xc-core = { workspace = true, features = ["test-support"] }
