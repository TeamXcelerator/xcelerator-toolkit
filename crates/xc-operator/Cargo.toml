[package]
name = "xc-operator"
description = "Reusable dense, structured, generalized, and matrix-free operator contracts."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
hp = ["dep:rug", "dep:gmp-mpfr-sys"]

[dependencies]
rayon = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
rug = { workspace = true, optional = true }
xc-core = { workspace = true }

# The native UCRT lane uses the same qualified GMP/MPFR for every HP producer.
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
gmp-mpfr-sys = { workspace = true, optional = true, features = ["use-system-libs"] }

[dev-dependencies]
xc-core = { workspace = true, features = ["test-support"] }
