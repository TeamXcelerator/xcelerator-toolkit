name: Isolated offline paper validation bootstrap

on:
  push:
    branches: [work/ccm-audit-hardening]
    paths: [.github/workflows/local-validation-bootstrap.yml]

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve paper dependencies against the integrated research candidate
        env:
          CARGO_HOME: ${{ runner.temp }}/paper-cargo-home
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CANDIDATE: 9a28cf3b4db2ae4a72915bfe39e61591481a6907
        run: |
          git clone --quiet --depth 1 --branch work/ccm-audit-hardening https://github.com/TeamXcelerator/ccm-reproduction-and-convergence.git "$RUNNER_TEMP/paper1"
          git clone --quiet --depth 1 --branch work/ccm-audit-hardening https://github.com/TeamXcelerator/ccm-convergence-rate.git "$RUNNER_TEMP/paper3"
          rustup update stable
          mkdir -p "$RUNNER_TEMP/paper-validation-bootstrap"
          # Explicit scratch-only candidate selection. Original lockfiles are
          # retained; unavailable historical git identities are never relabeled.
          python3 - <<'PY'
          import os,re,shutil
          from pathlib import Path
          for name in ['paper1','paper3']:
              root=Path(os.environ['RUNNER_TEMP'])/name
              dest=Path(os.environ['RUNNER_TEMP'])/'paper-validation-bootstrap'
              shutil.copy2(root/'Cargo.lock',dest/(name+'.original.lock'))
              path=root/'Cargo.toml'
              text=path.read_text()
              text=re.sub(r'tag = "v0\.(?:13\.5|14\.2)"', 'rev = "'+os.environ['CANDIDATE']+'"',text)
              path.write_text(text)
          PY
          for paper in paper1 paper3; do
            cargo fetch --manifest-path "$RUNNER_TEMP/$paper/Cargo.toml"
            cp "$RUNNER_TEMP/$paper/Cargo.toml" "$RUNNER_TEMP/paper-validation-bootstrap/$paper.Cargo.toml"
            cp "$RUNNER_TEMP/$paper/Cargo.lock" "$RUNNER_TEMP/paper-validation-bootstrap/$paper.Cargo.lock"
          done
          tar -C "$CARGO_HOME" -czf "$RUNNER_TEMP/paper-validation-bootstrap/cargo-home.tar.gz" registry git
          cd "$RUNNER_TEMP/paper-validation-bootstrap"
          sha256sum cargo-home.tar.gz *.toml *.lock > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-paper-validation-dependencies
          path: ${{ runner.temp }}/paper-validation-bootstrap/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
