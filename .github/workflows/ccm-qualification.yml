name: CCM qualification

on:
  push:
    branches: [work/ccm-audit-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccm-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XC_CACHE_REMOTE: none
      XC_PUBLISH_TARGET: none
      XC_PUBLISH_EXECUTE: 'false'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Isolate caches and record toolchain
        run: |
          echo "XC_CACHE_ROOT=$RUNNER_TEMP/xc-cache" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/xc-target" >> "$GITHUB_ENV"
          rustup update stable
          rustup component add rustfmt clippy --toolchain stable
          rustc -Vv
          cargo -V
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential m4 libgmp-dev libmpfr-dev libmpc-dev libflint-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Default workspace tests
        run: cargo test --workspace --locked
      - name: High precision and interval regression tests
        run: cargo test --workspace --features hp,arb --locked
      - name: Warnings-as-errors Clippy
        run: cargo clippy --workspace --all-targets --features hp,arb --locked -- -D warnings
