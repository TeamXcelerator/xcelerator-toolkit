name: CCM qualification

# Explicit qualification only. Ordinary source edits do not start a run.
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run release-mode performance comparisons
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ccm-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XC_CACHE_REMOTE: none
      XC_PUBLISH_TARGET: none
      XC_PUBLISH_EXECUTE: 'false'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Isolate caches and record the exact source and toolchain
        run: |
          echo "XC_CACHE_ROOT=$RUNNER_TEMP/xc-cache" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/xc-target" >> "$GITHUB_ENV"
          git rev-parse HEAD
          rustup update stable
          rustup component add rustfmt clippy --toolchain stable
          rustc -Vv
          cargo -V
      - name: Install native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential m4 libgmp-dev libmpfr-dev libmpc-dev libflint-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Read-only inventory regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Default workspace tests
        run: cargo test --workspace --locked --quiet --no-fail-fast
      - name: High-precision workspace tests without interval backend
        run: cargo test --workspace --features hp --locked --quiet --no-fail-fast
      - name: High-precision and interval workspace tests
        run: cargo test --workspace --features hp,arb --locked --quiet --no-fail-fast
      - name: Warnings-as-errors Clippy
        run: cargo clippy --workspace --all-targets --features hp,arb --locked --quiet -- -D warnings
      - name: Warnings-as-errors documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features hp,arb --locked --quiet
      - name: Release prime-component performance comparison
        if: ${{ inputs.benchmark }}
        run: cargo test -p xc-spectral --release --features hp --locked --quiet audit_prime_generator_benchmark -- --ignored --nocapture
      - name: Confirm source was not modified during qualification
        run: git diff --exit-code
