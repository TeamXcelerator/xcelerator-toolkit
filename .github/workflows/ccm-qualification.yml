name: CCM qualification

on:
  push:
    branches: [work/ccm-audit-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ccm-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XC_CACHE_REMOTE: none
      XC_PUBLISH_TARGET: none
      XC_PUBLISH_EXECUTE: 'false'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # BEGIN ONE-SHOT MATERIALIZATION
      - name: Apply source-hash-guarded numerical and research edits
        run: |
          python3 tools/apply_ccm_hardening.py
          python3 tools/extend_ccm_research.py
      # END ONE-SHOT MATERIALIZATION
      - name: Isolate caches and record toolchain
        run: |
          echo "XC_CACHE_ROOT=$RUNNER_TEMP/xc-cache" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/xc-target" >> "$GITHUB_ENV"
          rustup update stable
          rustup component add rustfmt clippy --toolchain stable
          rustc -Vv
          cargo -V
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential m4 libgmp-dev libmpfr-dev libmpc-dev libflint-dev
      - name: Formatting
        run: cargo fmt --all
      - name: Read-only inventory regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Default workspace tests
        run: cargo test --workspace --locked
      - name: High precision and interval regression tests
        run: cargo test --workspace --features hp,arb --locked
      - name: Warnings-as-errors Clippy
        run: cargo clippy --workspace --all-targets --features hp,arb --locked -- -D warnings
      - name: Release prime-generator performance comparison
        run: cargo test -p xc-spectral --release --features hp --locked audit_prime_generator_benchmark -- --ignored --nocapture
      # BEGIN ONE-SHOT PUBLICATION
      - name: Commit only qualified source edits to the authorized work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ccm-audit-hardening' && github.repository == 'TeamXcelerator/xcelerator-toolkit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/ccm-qualification.yml')
          text = path.read_text().replace('  contents: write', '  contents: read')
          text = re.sub(r'      # BEGIN ONE-SHOT MATERIALIZATION\n.*?      # END ONE-SHOT MATERIALIZATION\n', '', text, flags=re.S)
          text = re.sub(r'      # BEGIN ONE-SHOT PUBLICATION\n.*?      # END ONE-SHOT PUBLICATION\n', '', text, flags=re.S)
          text = text.replace('run: cargo fmt --all\n', 'run: cargo fmt --all -- --check\n')
          path.write_text(text)
          PY
          git rm -- tools/apply_ccm_hardening.py tools/extend_ccm_research.py
          git add -- crates Cargo.toml Cargo.lock tests/external-consumer tools .github/workflows/ccm-qualification.yml
          git -c user.name=TeamXceleratorDev -c user.email=5178942+TeamXceleratorDev@users.noreply.github.com commit -m "v0.14.4: qualify CCM correctness, research, and performance hardening"
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/work/ccm-audit-hardening
      # END ONE-SHOT PUBLICATION
