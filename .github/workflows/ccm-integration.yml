name: Controlled CCM source integration

# One deliberate run when this file is edited, not on ordinary source edits.
# Workflow cleanup is performed through the authenticated owner connection.
on:
  push:
    branches: [work/ccm-audit-hardening]
    paths: [.github/workflows/ccm-integration.yml]

permissions:
  contents: write

concurrency:
  group: ccm-controlled-integration
  cancel-in-progress: false

jobs:
  integrate-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XC_CACHE_REMOTE: none
      XC_PUBLISH_TARGET: none
      XC_PUBLISH_EXECUTE: 'false'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated build environment
        run: |
          echo "XC_CACHE_ROOT=$RUNNER_TEMP/xc-cache" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/xc-target" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/ccm-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccm-evidence"
          rustup update stable
          rustup component add rustfmt clippy --toolchain stable
          rustc -Vv | tee "$RUNNER_TEMP/ccm-evidence/toolchain.txt"
          cargo -V | tee -a "$RUNNER_TEMP/ccm-evidence/toolchain.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential m4 libgmp-dev libmpfr-dev libmpc-dev libflint-dev
      - name: Commit actual integrated source to the work branch
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/integrate_candidate.py
          cargo fmt --all
          # Do not ask a runtime token to change its own workflow permissions.
          # Only tracked source edits and retired preparation scripts are staged.
          git restore -- .github/workflows
          git diff --check
          git add -u -- crates Cargo.toml Cargo.lock tests/external-consumer tools
          git -c user.name=TeamXceleratorDev -c user.email=5178942+TeamXceleratorDev@users.noreply.github.com commit -m "v0.14.4: integrate CCM correctness, research, and performance improvements"
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/work/ccm-audit-hardening
          git rev-parse HEAD | tee "$EVIDENCE/source-commit.txt"
          git diff e4e8ec5912c12ae12836187813b6962e5cd71aa6..HEAD --stat | tee "$EVIDENCE/source-stat.txt"
          git diff e4e8ec5912c12ae12836187813b6962e5cd71aa6..HEAD > "$EVIDENCE/source.patch"
          git archive --format=tar.gz -o "$EVIDENCE/source.tar.gz" HEAD
          git diff --exit-code
      - name: Formatting and inventory regression tests
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee "$EVIDENCE/format.log"
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee "$EVIDENCE/python.log"
      - name: Default workspace tests
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --workspace --locked --quiet --no-fail-fast 2>&1 | tee "$EVIDENCE/default.log"
      - name: High precision and interval workspace tests
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --workspace --features hp,arb --locked --quiet --no-fail-fast 2>&1 | tee "$EVIDENCE/hp-arb.log"
      - name: Warnings-as-errors Clippy
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --features hp,arb --locked --quiet -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
      - name: Warnings-as-errors documentation
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -o pipefail
          cargo doc --workspace --no-deps --features hp,arb --locked --quiet 2>&1 | tee "$EVIDENCE/rustdoc.log"
      - name: Release performance comparison with v0.14.3 and generator route
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p xc-spectral --release --features hp --locked --quiet audit_prime_generator_benchmark -- --ignored --nocapture 2>&1 | tee "$EVIDENCE/benchmark.log"
      - name: Preserve public-source qualification evidence
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ccm-integrated-source-and-qualification
          path: ${{ runner.temp }}/ccm-evidence/
          retention-days: 14
          if-no-files-found: error
